services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securegate-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_APP_NAME=SecureGate AI
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - securegate-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securegate-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=SecureGate AI
      - APP_VERSION=0.4.0
      - SECUREGATE_API_KEY=${SECUREGATE_API_KEY:-change-me}
      - STORAGE_ROOT=storage
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL:-http://localhost:8000}
      - GITHUB_TRIGGER_TOKEN=${GITHUB_TRIGGER_TOKEN:-}
      - GITHUB_WORKFLOW_FILE=${GITHUB_WORKFLOW_FILE:-securegate.yml}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - DATABASE_URL=postgresql://securegate:securegate_password@postgres:5432/securegate
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-true}
      - ALERTMANAGER_URL=${ALERTMANAGER_URL:-http://alertmanager:9093}
      - ALERT_ESCALATION_MINUTES=${ALERT_ESCALATION_MINUTES:-30}
      - SECURITY_SCORE_THRESHOLD=${SECURITY_SCORE_THRESHOLD:-80}
      - CRITICAL_VULNERABILITY_THRESHOLD=${CRITICAL_VULNERABILITY_THRESHOLD:-0}
      - HIGH_VULNERABILITY_THRESHOLD=${HIGH_VULNERABILITY_THRESHOLD:-5}
      - BLOCK_HIGH_VULNERABILITIES=${BLOCK_HIGH_VULNERABILITIES:-true}
      - QUALITY_GATE_REQUIRED=${QUALITY_GATE_REQUIRED:-true}
      - SECRET_DETECTION_REQUIRED=${SECRET_DETECTION_REQUIRED:-true}
      - ENABLE_MONITORING=${ENABLE_MONITORING:-true}
      - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-true}
      - AI_ENABLED=${AI_ENABLED:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-300}
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres
      - ollama
    networks:
      - securegate-network

  ollama:
    image: ollama/ollama:latest
    container_name: securegate-ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - securegate-network

  postgres:
    image: postgres:16-alpine
    container_name: securegate-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=securegate
      - POSTGRES_USER=securegate
      - POSTGRES_PASSWORD=securegate_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - securegate-network

  sonarqube:
    image: sonarqube:10.6-community
    container_name: securegate-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - securegate-network

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: securegate-prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - securegate-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: securegate-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
    command:
      - "--config.file=/etc/alertmanager/config.yml"
    networks:
      - securegate-network

  grafana:
    image: grafana/grafana:11.1.3
    container_name: securegate-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - alertmanager
    networks:
      - securegate-network

networks:
  securegate-network:
    driver: bridge

volumes:
  postgres-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  prometheus-data:
  grafana-data:
  ollama-data:
