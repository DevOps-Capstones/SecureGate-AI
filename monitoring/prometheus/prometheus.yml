global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: securegate-backend
    metrics_path: /metrics
    static_configs:
      - targets: [backend:8000]
  - job_name: securegate-frontend
    static_configs:
      - targets: [frontend:5173]
  - job_name: postgres
    static_configs:
      - targets: [postgres:5432]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
